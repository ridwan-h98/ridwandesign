  <rect x="120" y="310" width="150" height="12" rx="2" fill="#E5E7EB"/>
  
  <!-- Main Content Area -->
  <rect x="320" y="180" width="560" height="500" rx="4" fill="white"/>
  
  <!-- UI Elements -->
  <rect x="350" y="210" width="300" height="24" rx="4" fill="#111827"/>
  <rect x="350" y="250" width="500" height="16" rx="4" fill="#D1D5DB"/>
  <rect x="350" y="280" width="450" height="16" rx="4" fill="#D1D5DB"/>
  
  <!-- Card Elements -->
  <rect x="350" y="330" width="240" height="160" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="370" y="350" width="200" height="12" rx="2" fill="#111827"/>
  <rect x="370" y="380" width="180" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="370" y="400" width="190" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="370" y="450" width="80" height="24" rx="4" fill="#3B82F6"/>
  
  <rect x="610" y="330" width="240" height="160" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="630" y="350" width="200" height="12" rx="2" fill="#111827"/>
  <rect x="630" y="380" width="180" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="630" y="400" width="190" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="630" y="450" width="80" height="24" rx="4" fill="#3B82F6"/>
  
  <rect x="350" y="510" width="240" height="160" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="370" y="530" width="200" height="12" rx="2" fill="#111827"/>
  <rect x="370" y="560" width="180" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="370" y="580" width="190" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="370" y="630" width="80" height="24" rx="4" fill="#3B82F6"/>
  
  <rect x="610" y="510" width="240" height="160" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="630" y="530" width="200" height="12" rx="2" fill="#111827"/>
  <rect x="630" y="560" width="180" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="630" y="580" width="190" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="630" y="630" width="80" height="24" rx="4" fill="#3B82F6"/>
  
  <!-- Decorative Elements -->
  <circle cx="850" cy="130" r="16" fill="#3B82F6" opacity="0.2"/>
  <circle cx="850" cy="130" r="8" fill="#3B82F6"/>
  
  <!-- Dark Mode Toggle for Design -->
  <g>
    <rect x="780" y="120" width="40" height="20" rx="10" fill="#D1D5DB"/>
    <circle cx="790" cy="130" r="8" fill="white"/>
