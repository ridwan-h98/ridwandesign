<svg width="1000" height="800" viewBox="0 0 1000 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="800" rx="12" fill="#F9FAFB"/>
  
  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  </pattern>
  <rect width="1000" height="800" fill="url(#grid)"/>
  
  <!-- Main UI Frame -->
  <rect x="100" y="100" width="800" height="600" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="100" y="100" width="800" height="60" rx="8 8 0 0" fill="#F3F4F6"/>
  <circle cx="140" cy="130" r="10" fill="#EF4444"/>
  <circle cx="180" cy="130" r="10" fill="#F59E0B"/>
  <circle cx="220" cy="130" r="10" fill="#10B981"/>
  
  <!-- Sidebar -->
  <rect x="100" y="160" width="200" height="540" fill="#F9FAFB"/>
  <rect x="120" y="190" width="160" height="12" rx="2" fill="#E5E7EB"/>
  <rect x="120" y="220" width="140" height="12" rx="2" fill="#E5E7EB"/>
  <rect x="120" y="250" width="160" height="12" rx="2" fill="#E5E7EB"/>
